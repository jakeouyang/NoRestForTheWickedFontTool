name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained executable
        run: >
          dotnet publish WickedFontTool.csproj --configuration Release --runtime win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None
          --output release/WickedFontTool
      - name: Add release documents
        shell: pwsh
        run: |
          Copy-Item README.md release/WickedFontTool/
          Copy-Item THIRD-PARTY.md release/WickedFontTool/
          Copy-Item LICENSE release/WickedFontTool/
          Copy-Item third_party/AssetsTools.NET/LICENSE release/WickedFontTool/AssetsTools.NET.LICENSE.txt
          Compress-Archive -Path release/WickedFontTool -DestinationPath release/WickedFontTool-win-x64.zip
          (Get-FileHash release/WickedFontTool-win-x64.zip -Algorithm SHA256).Hash + '  WickedFontTool-win-x64.zip' | Set-Content release/WickedFontTool-win-x64.zip.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" release/WickedFontTool-win-x64.zip release/WickedFontTool-win-x64.zip.sha256 --generate-notes
