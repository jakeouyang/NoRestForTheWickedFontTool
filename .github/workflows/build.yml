name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build WickedFontTool.csproj --configuration Release
      - name: Run self-test
        run: dotnet run --project WickedFontTool.csproj --configuration Release -- --self-test test-output
